# Render Blueprint for QLens: one Docker web service and one Render Postgres database, both on the free plan.
# Use it from the Render dashboard: New > Blueprint > pick this repository. See DEPLOY.md.
services:
  - type: web
    name: qlens
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Option A (default): the Render Postgres database declared below, over Render's private network.
      - key: DATABASE_URL
        fromDatabase:
          name: qlens-db
          property: connectionString
      # Option B: an external database such as Neon. Delete option A above (and the `databases:` section
      # below), uncomment these two lines, and paste the URL in the dashboard when the Blueprint asks for it.
      # Use the direct (not "-pooler") connection string and keep its ?sslmode=require.
      # - key: DATABASE_URL
      #   sync: false
      - key: SECRET_KEY
        # Generated once and then kept. Workspace role passwords are derived from it, so never change it
        # on a live database: existing workspaces would stop being able to log in.
        generateValue: true
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: ROLE_PREFIX
        value: qlens_ws_
      # Optional: turns on Ask AI and the Design assistant. Left blank, those features say they are off.
      - key: GEMINI_API_KEY
        sync: false
      # - key: GEMINI_MODEL
      #   value: gemini-3.5-flash

databases:
  - name: qlens-db
    plan: free
    databaseName: qlens
    user: qlens_app
    # Reachable only from Render services in the same region, not from the internet.
    ipAllowList: []
