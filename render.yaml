# Render Blueprint for QLens: one Docker web service on the free plan; the database is an external Neon Postgres.
# Use it from the Render dashboard: New > Blueprint > pick this repository. See DEPLOY.md.
services:
  - type: web
    name: qlens
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # The database is external (Neon, free, no expiry): Render's free Postgres cannot run CREATE ROLE, which QLens
      # needs for its per-workspace roles. Paste Neon's DIRECT connection string (host without "-pooler", keep
      # ?sslmode=require) when the Blueprint asks for it, or later under qlens > Environment. See DEPLOY.md.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        # Generated once and then kept. Workspace role passwords are derived from it, so never change it
        # on a live database: existing workspaces would stop being able to log in.
        generateValue: true
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: ROLE_PREFIX
        value: qlens_ws_
      # Optional: turns on Ask AI and the Design assistant. Left blank, those features say they are off.
      - key: GEMINI_API_KEY
        sync: false
      # - key: GEMINI_MODEL
      #   value: gemini-3.5-flash

