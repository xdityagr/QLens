[project]
name = "qlens"
version = "0.1.0"
description = "QLens: spreadsheet to normalized PostgreSQL schema, plus a SQL lab"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary,pool]>=3.3",
    "pglast>=8",
    "openpyxl",
    "argon2-cffi",
    "pydantic-settings",
    "python-multipart",
    "google-genai>=2.33.0",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
